name: validate

# Two layers, matching the two things that can go wrong with a Wazuh ruleset:
#   lint      — structural mistakes that are silent at load time (seconds, no Wazuh)
#   analysisd — the authoritative "does the manager accept this" check (a container)
#
# The analysisd job runs against a pinned version that must pass, and against the
# newest release as an advisory signal. This ruleset chains onto stock rule ids
# (87200 Proxmox, 60103/60106/91802 Windows, 80700/80792 Linux) and reproduces
# eleven stock rule bodies under overwrite="yes", so an upstream release is the
# most likely way for it to break — silently, by no longer firing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catches a new Wazuh release breaking the ruleset even with no commits.
    - cron: "0 6 * * 1"

jobs:
  lint:
    name: structural lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Run lint
        run: python3 .github/scripts/lint_ruleset.py

  analysisd:
    name: analysisd -t (${{ matrix.wazuh }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wazuh: "4.14.3"        # the version this set is validated on
            advisory: false
          - wazuh: "4.14.7"        # newest 4.14.x — advisory
            advisory: true
          - wazuh: "5.0.0-beta5"   # early warning for the 5.x break — advisory
            advisory: true
    steps:
      - uses: actions/checkout@v4

      - name: Stage a flat ruleset
        # Wazuh does not recurse into subdirectories of etc/rules, so flatten
        # rules/<platform>/*.xml into one directory before loading.
        run: |
          mkdir -p stage/rules stage/decoders
          cp rules/*/*.xml       stage/rules/
          cp decoders/*/*.xml    stage/decoders/
          echo "staged $(ls stage/rules | wc -l) rule files, $(ls stage/decoders | wc -l) decoders"

      - name: Load the deployed ruleset and validate
        run: |
          set -euo pipefail
          IMG=wazuh/wazuh-manager:${{ matrix.wazuh }}

          # /var/ossec/etc is empty in the image; the entrypoint populates it at
          # startup. So boot the container normally and validate inside it rather
          # than overriding the entrypoint.
          cid=$(docker run -d "$IMG")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          echo "waiting for the manager to populate /var/ossec/etc ..."
          for i in $(seq 1 90); do
            if docker exec "$cid" test -f /var/ossec/etc/internal_options.conf 2>/dev/null; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
          done

          if ! docker exec "$cid" test -f /var/ossec/etc/internal_options.conf; then
            echo "::error::/var/ossec/etc never populated — image layout may have changed"
            docker exec "$cid" find / -name internal_options.conf 2>/dev/null | head || true
            docker logs "$cid" 2>&1 | tail -30
            exit 1
          fi

          docker cp stage/rules/.    "$cid:/var/ossec/etc/rules/"
          docker cp stage/decoders/. "$cid:/var/ossec/etc/decoders/"
          docker exec "$cid" chown -R wazuh:wazuh /var/ossec/etc/rules /var/ossec/etc/decoders
          docker exec "$cid" chmod 660 -R /var/ossec/etc/rules /var/ossec/etc/decoders

          echo "--- validating"
          docker exec -w /var/ossec "$cid" /var/ossec/bin/wazuh-analysisd -t

      - name: Confirm experimental/ is still rejected
        # experimental/windows_normalize.xml attaches child decoders to the
        # windows_eventchannel plugin decoder, which 4.14.x refuses. It ships as a
        # documented dead end, so CI asserts it stays dead rather than quietly
        # becoming loadable and misleading the README.
        continue-on-error: true
        run: |
          set -uo pipefail
          IMG=wazuh/wazuh-manager:${{ matrix.wazuh }}
          cid=$(docker run -d "$IMG")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            docker exec "$cid" test -f /var/ossec/etc/internal_options.conf 2>/dev/null && break
            sleep 1
          done
          docker cp stage/rules/.    "$cid:/var/ossec/etc/rules/"
          docker cp stage/decoders/. "$cid:/var/ossec/etc/decoders/"
          docker cp experimental/windows_normalize.xml "$cid:/var/ossec/etc/decoders/"
          docker exec "$cid" chown -R wazuh:wazuh /var/ossec/etc/rules /var/ossec/etc/decoders
          if docker exec -w /var/ossec "$cid" /var/ossec/bin/wazuh-analysisd -t >/dev/null 2>&1; then
            echo "::warning::windows_normalize.xml now LOADS on ${{ matrix.wazuh }} — experimental/README.md is out of date"
          else
            echo "still rejected on ${{ matrix.wazuh }}, as documented"
          fi
