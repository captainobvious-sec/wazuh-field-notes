name: validate

# Two layers, matching the two things that can go wrong with a Wazuh ruleset:
#   lint      — structural mistakes that are silent at load time (seconds, no Wazuh)
#   analysisd — the authoritative "does the manager accept this" check (a container)
#
# The analysisd job runs against a pinned version that must pass, and against the
# newest release as an advisory signal. This ruleset chains onto stock rule ids
# (87200 Proxmox, 60103/60106/91802 Windows, 80700/80792 Linux) and reproduces
# eleven stock rule bodies under overwrite="yes", so an upstream release is the
# most likely way for it to break — silently, by no longer firing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catches a new Wazuh release breaking the ruleset even with no commits.
    - cron: "0 6 * * 1"

jobs:
  lint:
    name: structural lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Run lint
        run: python3 .github/scripts/lint_ruleset.py

  analysisd:
    name: analysisd -t (${{ matrix.wazuh }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wazuh: "4.14.3"        # the version this set is validated on
            advisory: false
          - wazuh: "4.14.7"        # newest 4.14.x — advisory
            advisory: true
          - wazuh: "5.0.0-beta5"   # early warning for the 5.x break — advisory
            advisory: true
    steps:
      - uses: actions/checkout@v4

      - name: Load the deployed ruleset and validate
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/repo:ro" \
            wazuh/wazuh-manager:${{ matrix.wazuh }} -c '
              set -uo pipefail
              # analysisd resolves etc/internal_options.conf relative to its own
              # home, so it must be run from /var/ossec, not from /.
              cd /var/ossec
              echo "--- cwd: $(pwd)"
              ls -1 etc/internal_options.conf 2>&1 || { echo "--- etc/:"; ls -1 etc/ | head -20; }
              mkdir -p etc/rules etc/decoders
              install -o wazuh -g wazuh -m 660 /repo/rules/*/*.xml    etc/rules/
              install -o wazuh -g wazuh -m 660 /repo/decoders/*/*.xml etc/decoders/
              echo "--- loaded: $(ls -1 etc/rules/*.xml | wc -l) rule files, $(ls -1 etc/decoders/*.xml | wc -l) decoder files"
              ./bin/wazuh-analysisd -t
            '

      - name: Confirm experimental/ is still rejected
        # experimental/windows_normalize.xml attaches child decoders to the
        # windows_eventchannel plugin decoder, which 4.14.x refuses. It ships as a
        # documented dead end, so CI asserts it stays dead rather than quietly
        # becoming loadable and misleading the README.
        continue-on-error: true
        run: |
          if docker run --rm --entrypoint bash -v "$PWD:/repo:ro" \
               wazuh/wazuh-manager:${{ matrix.wazuh }} -c '
                 cd /var/ossec
                 mkdir -p etc/rules etc/decoders
                 install -o wazuh -g wazuh -m 660 /repo/rules/*/*.xml etc/rules/
                 install -o wazuh -g wazuh -m 660 /repo/decoders/*/*.xml etc/decoders/
                 install -o wazuh -g wazuh -m 660 /repo/experimental/windows_normalize.xml etc/decoders/
                 ./bin/wazuh-analysisd -t
               ' >/dev/null 2>&1; then
            echo "::warning::windows_normalize.xml now LOADS on ${{ matrix.wazuh }} — experimental/README.md is out of date"
          else
            echo "still rejected on ${{ matrix.wazuh }}, as documented"
          fi
