###############################################################################
# /etc/rsyslog.d/10-unifi.conf  -- UniFi syslog aggregator for Wazuh
#
# WHY: UniFi OS / UNAS devices emit CEF with their OWN "timestamp hostname"
# header (e.g. "2026-06-04T21:37:12.610Z UNAS 2 CEF:0|Ubiquiti|..."), and this
# relay prepends ANOTHER timestamp + source IP. The resulting DOUBLE header
# makes Wazuh's predecoder read program_name as the inner timestamp
# (e.g. "2026-06-04T21") instead of "CEF", so the unifi decoder never fires.
#
# This rewrites CEF lines to ONE clean header that Wazuh parses as
# program_name=CEF:
#     <iso-ts> <source-ip> CEF:0|Ubiquiti|...
# Non-CEF UniFi lines (firewall, etc.) are written timestamp+hostname+msg,
# i.e. unchanged from how they work today.
###############################################################################

module(load="imudp")
module(load="imtcp")

# --- CEF lines: one timestamp + source IP + the CEF payload only ---
template(name="unifi_cef_clean" type="list") {
    property(name="timereported" dateFormat="rfc3339")
    constant(value=" ")
    property(name="fromhost-ip")
    constant(value=" ")
    property(name="$!cefmsg")
    constant(value="\n")
}

# --- Everything else (firewall, etc.): timestamp + parsed hostname + message ---
template(name="unifi_other" type="list") {
    property(name="timereported" dateFormat="rfc3339")
    constant(value=" ")
    property(name="hostname")
    constant(value=" ")
    property(name="msg" spifno1stsp="on")
    constant(value="\n")
}

ruleset(name="unifi") {
    if ($rawmsg contains "CEF:0|Ubiquiti") then {
        # keep only "CEF:" .. end-of-line (drops the inner timestamp + "UNAS 2")
        set $!cefmsg = re_extract($rawmsg, "CEF:.*", 0, 0, "");
        action(type="omfile" file="/var/log/unifi/unifi.log"
               template="unifi_cef_clean"
               createDirs="on" fileCreateMode="0640" dirCreateMode="0755")
    } else {
        action(type="omfile" file="/var/log/unifi/unifi.log"
               template="unifi_other"
               createDirs="on" fileCreateMode="0640" dirCreateMode="0755")
    }
    stop
}

# UniFi devices send syslog here. Set the port to match your UniFi logging
# config (UniFi default is 514). If port 514 is already bound by another input
# in your existing rsyslog config, remove that one or change this port.
input(type="imudp" port="514" ruleset="unifi")
input(type="imtcp" port="514" ruleset="unifi")
